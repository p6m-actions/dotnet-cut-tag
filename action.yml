name: "Dotnet Cut Tag"
description: "Bumps version in Directory.Build.props and creates a git tag for .NET projects; falls back to tag-driven versioning when the file is absent (retrofits)"
author: "Jimmie Fulton <jimmie.fulton@gmail.com>"

# Define the inputs for this action
inputs:
  version-level:
    description: "The version level to bump (patch, minor, major)"
    required: false
    default: "patch"
  directory-build-props-path:
    description: "Path to Directory.Build.props file"
    required: false
    default: "Directory.Build.props"
  commit-changes:
    description: "Whether to commit the version changes"
    required: false
    default: "true"
  commit-message:
    description: "Custom commit message. Use {version} as placeholder for the new version"
    required: false
    default: "Bump version to {version} [skip ci]"
  skip-push:
    description: "Skip pushing changes and tags (useful for testing)"
    required: false
    default: "false"

# Define the outputs for this action
outputs:
  version:
    description: "The new version number"
    value: ${{ steps.bump-version.outputs.version }}
  tag:
    description: "The created git tag"
    value: ${{ steps.create-tag.outputs.tag }}

# Define the runs configuration
runs:
  using: "composite"
  steps:
    - name: Token Exchange
      uses: p6m-actions/token-exchange@v2

    - name: Bump version
      id: bump-version
      shell: bash
      run: |
        # Directory.Build.props is OUR archetype convention, not a .NET given: a legacy
        # repository being retrofitted has no version file to add. When the file is absent,
        # fall back to TAG-DRIVEN versioning (golang-cut-tag's model: the git tag IS the
        # version) — read the latest v-prefixed release tag, bump from it, and commit nothing.
        if [ -f "${{ inputs.directory-build-props-path }}" ]; then
          mode="props"
          # Extract current version from Directory.Build.props
          current_version=$(grep -oP '<VersionPrefix>\K[^<]+' "${{ inputs.directory-build-props-path }}")
          
          if [ -z "$current_version" ]; then
            echo "Error: Could not find VersionPrefix in Directory.Build.props"
            exit 1
          fi
        else
          mode="tags"
          echo "No ${{ inputs.directory-build-props-path }} — tag-driven mode (retrofit): the latest release tag decides"
          # A shallow checkout has no tags; fetch them here so callers need no fetch-depth: 0.
          git fetch --tags --quiet 2>/dev/null || true
          latest_tag=$(git tag --sort=-version:refname | awk '
            /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          if [ -n "$latest_tag" ]; then
            current_version="${latest_tag#v}"
            echo "Latest release tag: $latest_tag"
          else
            current_version="0.0.0"
            echo "Latest release tag: (none) — starting from 0.0.0"
          fi
        fi
        echo "mode=$mode" >> $GITHUB_OUTPUT
        
        echo "Current version: $current_version"
        
        # Parse version components
        IFS='.' read -r major minor patch <<< "$current_version"
        
        # Bump version based on input
        case "${{ inputs.version-level }}" in
          "major")
            major=$((major + 1))
            minor=0
            patch=0
            ;;
          "minor")
            minor=$((minor + 1))
            patch=0
            ;;
          "patch")
            patch=$((patch + 1))
            ;;
          *)
            echo "Error: Invalid version-level. Must be 'patch', 'minor', or 'major'"
            exit 1
            ;;
        esac
        
        new_version="$major.$minor.$patch"
        echo "New version: $new_version"
        
        if [ "$mode" == "props" ]; then
          # Update Directory.Build.props
          sed -i.bak "s/<VersionPrefix>$current_version<\/VersionPrefix>/<VersionPrefix>$new_version<\/VersionPrefix>/" "${{ inputs.directory-build-props-path }}"
          
          # Remove backup file
          rm "${{ inputs.directory-build-props-path }}.bak"
        fi
        
        echo "version=$new_version" >> $GITHUB_OUTPUT
    
    - name: Create git tag
      id: create-tag
      shell: bash
      run: |
        version="${{ steps.bump-version.outputs.version }}"
        tag="v$version"
        
        # Tag-driven mode bumps no file, so there is nothing to commit regardless of input.
        if [ "${{ steps.bump-version.outputs.mode }}" == "tags" ]; then
          echo "Tag-driven mode: no version file to commit"
        elif [ "${{ inputs.commit-changes }}" == "true" ]; then
          # Add and commit changes
          git add "${{ inputs.directory-build-props-path }}"
          
          # Replace {version} placeholder in commit message
          commit_message="${{ inputs.commit-message }}"
          commit_message="${commit_message//\{version\}/$version}"
          
          git commit -m "$commit_message"
          echo "Committed version changes"
        else
          echo "Skipping commit (commit-changes is false)"
        fi
        
        # Create tag
        git tag -a "$tag" -m "Release $tag"
        echo "Created tag: $tag"
        
        # Push changes and tag if not skipped
        if [ "${{ inputs.skip-push }}" != "true" ]; then
          if [ "${{ inputs.commit-changes }}" == "true" ] && [ "${{ steps.bump-version.outputs.mode }}" != "tags" ]; then
            git push origin HEAD
          fi
          git push origin "$tag"
          echo "Pushed changes and tag to origin"
        else
          echo "Skipping push (skip-push is true)"
        fi
        
        echo "tag=$tag" >> $GITHUB_OUTPUT

# Define the branding for the action in the GitHub Marketplace
branding:
  icon: "award"
  color: "blue"